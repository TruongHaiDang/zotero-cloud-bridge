[package]
name = "zotero-cloud-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.23"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
ureq = { version = "3", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
